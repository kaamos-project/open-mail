name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # I test non toccano WebView, portachiavi o rete: girano su Linux.
    # Le build native (Windows, macOS, iOS, Android) arriveranno con il
    # flusso di release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Stessa versione della libreria kaamos_project_ui.
          flutter-version: 3.50.1
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Formattazione
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analisi
        run: flutter analyze

      - name: Test
        run: flutter test
