name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Tests don't touch the WebView, keychain or network: they run on Linux.
    # Native builds (Windows, macOS, iOS, Android) will come with the
    # release workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same version as the kaamos_project_ui library.
          flutter-version: 3.50.1
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Formattazione
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analisi
        run: flutter analyze

      - name: Test
        run: flutter test
